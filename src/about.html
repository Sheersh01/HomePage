  <script>
    // Scroll animation observer
    const observerOptions = {
      threshold: 0.2,
      rootMargin: '0px 0px -50px 0px'
    };

    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add('animate');
        }
      });
    }, observerOptions);

    // Observe timeline checkpoints
    document.addEventListener('DOMContentLoaded', () => {
      const checkpoints = document.querySelectorAll('.checkpoint');
      const galleryItems = document.querySelectorAll('.item');
      const galleryTitle = document.querySelector('.section h1');

      checkpoints.forEach((checkpoint, index) => {
        // Add staggered delay for timeline items
        checkpoint.style.transitionDelay = `${index * 0.2}s`;
        observer.observe(checkpoint);
      });

      // Observe gallery items with staggered animation
      galleryItems.forEach((item, index) => {
        item.style.transitionDelay = `${index * 0.1}s`;
        observer.observe(item);
      });

      // Observe gallery title
      if (galleryTitle) {
        observer.observe(galleryTitle);
      }
    });
  </script>
